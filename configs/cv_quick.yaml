## Quick cross-validation preset: 3-fold, reduced epochs for fast iteration.
data:
  source: adult_income
  dataset: adult_income
  csv_path: null
  target_col: null
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

model:
  hidden_dims: [256, 128, 64]
  dropout: 0.3
  batch_norm: true

training:
  epochs: 30
  batch_size: 512
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  lr_scheduler_patience: 3
  lr_scheduler_factor: 0.5

paths:
  checkpoint_dir: checkpoints/
  best_model: checkpoints/best_model.pt
  final_model: checkpoints/final_model.pt

cross_validation:
  n_splits: 3
  random_seed: 42
  output: checkpoints/cv_quick_results.json

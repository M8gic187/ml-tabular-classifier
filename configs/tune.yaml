data:
  source: adult_income
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

# Base training settings used inside each trial (epochs, patience, scheduler).
# batch_size and learning_rate are overridden per-trial from the search space.
training:
  epochs: 60
  batch_size: 512          # overridden per trial
  learning_rate: 1.0e-3    # overridden per trial
  weight_decay: 1.0e-4     # overridden per trial
  early_stopping_patience: 8
  lr_scheduler_patience: 4
  lr_scheduler_factor: 0.5

tuning:
  n_trials: 30             # total Optuna trials to run
  timeout_seconds: null    # wall-clock limit (null = no limit)

  search_space:
    # Number of hidden layers
    n_layers:
      min: 1
      max: 4

    # Width choices for each hidden layer (sampled independently)
    hidden_dim_choices: [64, 128, 256, 512]

    # Dropout rate
    dropout:
      min: 0.0
      max: 0.5

    # Whether to use BatchNorm after each linear layer
    batch_norm_choices: [true, false]

    # AdamW learning rate (log-uniform)
    learning_rate:
      min: 1.0e-4
      max: 1.0e-2

    # AdamW weight decay (log-uniform)
    weight_decay:
      min: 1.0e-5
      max: 1.0e-2

    # Mini-batch size
    batch_size_choices: [128, 256, 512, 1024]

    # Early stopping patience per trial (can be tighter than full training)
    early_stopping_patience: 6

    # Maximum epochs per trial (keep low to speed up search)
    max_epochs_per_trial: 40
